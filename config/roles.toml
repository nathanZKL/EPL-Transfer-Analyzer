# Role recipes: which stats make up each role, and how much each stat counts.
#
# The weights are starting guesses by Claude (decision O3), to be tuned by Nathan once
# real rankings exist. They are relative: a stat with weight 0.4 counts twice as much as
# one with 0.2, and they don't have to add up to 1.
#
# Every stat name must be one of nbavalue/roles.py's KNOWN_STATS. Each is read from the
# percentile table as "<stat>_pctile" (0-100, higher is always better). A role's fit score
# is the weighted average of its stats' percentiles. If any of a player's stats is missing,
# that role's score is missing too (open question O9).
#
# Format of each role:
#   [role_key]
#   label = "Name shown in the app"
#   [role_key.weights]
#   stat_name = weight   (a number above 0)

[rim_protector]
label = "Rim protector"
[rim_protector.weights]
blocks_per100 = 0.4
rim_dfg_pct = 0.4
dreb_pct = 0.2

[three_and_d_wing]
label = "3-and-D wing"
[three_and_d_wing.weights]
fg3a_rate = 0.25
fg3_pct = 0.3
deflections_per100 = 0.2
contested_shots_per100 = 0.25

[primary_creator]
label = "Primary creator"
[primary_creator.weights]
usg_pct = 0.3
ast_pct = 0.4
pnr_bh_poss_per100 = 0.3

[shot_creator]
label = "Shot creator"
[shot_creator.weights]
iso_poss_per100 = 0.2
pullup_fga_per100 = 0.2
points_per100 = 0.25
iso_ppp = 0.2
pullup_fg_pct = 0.15

[interior_big]
label = "Interior big"
[interior_big.weights]
oreb_pct = 0.3
dreb_pct = 0.3
roll_man_ppp = 0.2
putback_ppp = 0.2

[connector]
label = "Connector"
[connector.weights]
ast_to_tov = 0.4
screen_assists_per100 = 0.3
deflections_per100 = 0.3
